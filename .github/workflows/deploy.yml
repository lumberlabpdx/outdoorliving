name: get deployed, nerd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Without these the build still succeeds, but the live contact form can't send anything
      - name: Check the contact form's variables are set
        if: ${{ !vars.VITE_SUPABASE_URL || !vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY under Settings → Secrets and variables → Actions → Variables"
          exit 1
      - uses: actions/checkout@v7
        with:
          # Nothing later pushes to the repo, so don't leave its access token in .git/config
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # Nothing deploys unless every check passes; the live site stays as it was
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Known high-severity vulnerabilities in the site's own packages (dev tools excluded)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The site's full address, for the link-preview image and search-engine data
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Contact form backend, from the repo's Actions variables (see README)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
